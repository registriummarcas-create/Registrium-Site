name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee ci-validation.log
      - name: Anexar log de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-log
          path: ci-validation.log
          retention-days: 7
